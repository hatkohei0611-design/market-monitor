name: daily-update

on:
  schedule:
    - cron: "0 7 * * *"   # 毎日 UTC 07:00 = 日本時間 16:00
  workflow_dispatch:        # 手動実行ボタンも有効化

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/daily_update.py

      - name: Commit results
        run: |
          git config user.name "market-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git commit -m "auto update $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
